<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{TITLE}} — MusicPro Studio</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0a0e14;--panel:#121923;--field:#0e141d;--border:#283342;--text:#edf2f7;--muted:#a2afc0;--subtle:#7e8fa5;--accent:#9ee9bd;--accentink:#0d2c20;--err:#ff9b8a}
@media (prefers-color-scheme:light){:root{--bg:#eef2f5;--panel:#fff;--field:#f7f9fb;--border:#cdd6df;--text:#142438;--muted:#506278;--subtle:#607288;--accent:#226e4e;--accentink:#fff;--err:#b3402c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:24px 16px}
.box{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;color:var(--text);text-decoration:none;margin-bottom:28px;justify-content:center}
.brand i{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
form{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px}
h1{font-size:22px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:14px;color:var(--muted)}
input{display:block;width:100%;margin-top:6px;padding:12px 13px;border-radius:9px;border:1px solid var(--border);background:var(--field);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:6px;padding:13px;border-radius:10px;border:0;background:var(--accent);color:var(--accentink);font:inherit;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.05)}
.msg{color:var(--err);font-size:14px;margin:0 0 14px}
.switch{text-align:center;color:var(--subtle);font-size:14px;margin-top:18px}
a{color:var(--accent)}
.hint{font-size:12px;color:var(--subtle);margin:-6px 0 14px}
</style>
</head>
<body>
<div class="box">
  <a class="brand" href="/"><i><svg viewBox="0 0 32 32" width="22" height="22"><path d="M8 23V9l8 8 8-8v14" fill="none" stroke="var(--accentink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>MusicPro</a>
  <form method="post" action="{{ACTION}}">
    <h1>{{TITLE}}</h1>
    {{MESSAGE}}
    <label>Email<input name="email" type="email" required autocomplete="email" value="{{EMAIL}}" autofocus></label>
    <label>Parol<input name="password" type="password" required minlength="8" autocomplete="{{AUTOCOMPLETE}}"></label>
    {{CONFIRM}}
    <button type="submit">{{BUTTON}}</button>
  </form>
  <p class="switch">{{SWITCH}}</p>
</div>
</body>
</html>
